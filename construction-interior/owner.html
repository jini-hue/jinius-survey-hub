<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>건설업/인테리어 회사 특화 질문지 - 대표자용</title><style>:root{--navy:#0b1f3a;--deep:#07162a;--line:#d8e2ef;--mist:#f4f7fb;--accent:#1f6feb;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:linear-gradient(135deg,var(--deep),var(--navy) 42%,#123f73);color:var(--ink)}.hero{color:white;padding:42px 18px 30px;text-align:center}.badge{display:inline-block;border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:7px 13px;font-size:13px;margin-bottom:14px;background:rgba(255,255,255,.08)}h1{margin:0 auto 12px;max-width:860px;font-size:clamp(27px,5vw,42px);line-height:1.22}.hero p{margin:0 auto;max-width:760px;color:#d9e6f8;line-height:1.65}.wrap{max-width:920px;margin:0 auto;padding:0 18px 60px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px rgba(6,18,36,.22)}.switch{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:22px;color:var(--muted);font-size:14px}.switch a{color:var(--accent);font-weight:700;text-decoration:none}.field{border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;background:#fff}label{display:block;font-weight:750;line-height:1.5}.num{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:var(--navy);color:white;font-size:13px;margin-right:9px}input,textarea{width:100%;margin-top:12px;border:1px solid #cfd8e5;border-radius:14px;padding:13px 14px;font:inherit;line-height:1.5;outline:none;background:#fbfdff}button{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,#1f6feb,#0b4ab0);color:white;padding:17px 20px;font-size:17px;font-weight:850;cursor:pointer}button:disabled{opacity:.55}.message{display:none;margin-top:14px;padding:14px;border-radius:14px;font-weight:700}.ok{background:#ecfdf3;color:#087443;border:1px solid #abefc6}.err{background:#fff1f3;color:#c01048;border:1px solid #fecdd6}</style></head><body><div class="hero"><div class="badge">JINIUS 숫자경영 사전진단 · 건설업/인테리어</div><h1>건설업/인테리어 회사 특화 질문지 - 대표자용</h1><p>대표/임원 관점에서 견적, 계약변경, 현장별 손익, 자금흐름, 증빙관리, 대시보드 니즈를 진단합니다.<br>응답 내용은 지니어스 내부 진단용 구글시트에만 저장됩니다.</p></div><main class="wrap"><form id="survey" class="card"><div class="switch"><span>현재 질문지: <b>대표자용</b></span><a href="/construction-interior/staff.html">실무자용으로 이동</a></div><div class="field"><label><span class="num">1</span>성함</label><input type="text" name="q0" required placeholder="답변을 입력해주세요"></div><div class="field"><label><span class="num">2</span>회사명</label><input type="text" name="q1" required placeholder="답변을 입력해주세요"></div><div class="field"><label><span class="num">3</span>직책/역할</label><input type="text" name="q2" required placeholder="답변을 입력해주세요"></div><div class="field"><label><span class="num">4</span>현재 회사의 주요 인테리어 사업 유형은 무엇인가요?</label><textarea name="q3" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">5</span>월/분기 기준 진행 프로젝트 수와 평균 공사금액은 어느 정도인가요?</label><textarea name="q4" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">6</span>현재 가장 먼저 해결해야 할 숫자경영/관리 문제는 무엇인가요?</label><textarea name="q5" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">7</span>견적 단계에서 실행예산·예상마진을 어느 수준까지 확인하고 계신가요?</label><textarea name="q6" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">8</span>계약 후 설계변경/추가공사/감액이 발생할 때 금액과 승인 히스토리는 어떻게 관리하나요?</label><textarea name="q7" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">9</span>현장별 매출·원가·마진을 언제, 어떤 기준으로 확인하시나요?</label><textarea name="q8" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">10</span>자재비·외주비·인건비·운반비·공통비 중 가장 통제하기 어려운 항목은 무엇인가요?</label><textarea name="q9" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">11</span>현장별 미수금·미지급금·예정입금/예정지출은 어떻게 보고 있나요?</label><textarea name="q10" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">12</span>대표님이 매일/매주 보고 싶은 KPI 5가지는 무엇인가요?</label><textarea name="q11" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">13</span>현재 사용하는 프로그램/엑셀/시트/회계도구는 무엇인가요?</label><textarea name="q12" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">14</span>업무폰·현장사진·견적서·계약서·세금계산서·영수증 등 자료는 어디에 흩어져 있나요?</label><textarea name="q13" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">15</span>새 시스템 도입 시 가장 우려되는 점은 무엇인가요?</label><textarea name="q14" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">16</span>인테리어 회사 전용 OS가 있다면 가장 먼저 자동화하고 싶은 업무 3가지는 무엇인가요?</label><textarea name="q15" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">17</span>현장 방문/킥오프 전 지니어스가 미리 확인해야 할 자료는 무엇인가요?</label><textarea name="q16" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">18</span>추가로 전달하고 싶은 내용이 있으면 자유롭게 작성해주세요.</label><textarea name="q17" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><button id="submitBtn" type="submit">답변 제출하기</button><div id="msg" class="message"></div></form></main><script>const form=document.getElementById('survey'),btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='제출 중입니다...';msg.style.display='none';const fd=new FormData(form),answers={};for(let i=0;i<18;i++)answers['q'+i]=(fd.get('q'+i)||'').toString().trim();try{const res=await fetch('https://decorating-discrimination-height-journalist.trycloudflare.com/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'interior_owner',answers})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'제출에 실패했습니다.');form.reset();msg.className='message ok';msg.textContent='제출 완료되었습니다. 소중한 답변 감사합니다.';msg.style.display='block';}catch(err){msg.className='message err';msg.textContent='제출 중 오류가 발생했습니다: '+err.message;msg.style.display='block';}finally{btn.disabled=false;btn.textContent='답변 제출하기';}});</script></body></html>
