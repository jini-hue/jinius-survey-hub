<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>건설업/인테리어 회사 특화 질문지 - 실무자용</title><style>:root{--navy:#0b1f3a;--deep:#07162a;--line:#d8e2ef;--mist:#f4f7fb;--accent:#1f6feb;--ink:#172033;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:linear-gradient(135deg,var(--deep),var(--navy) 42%,#123f73);color:var(--ink)}.hero{color:white;padding:42px 18px 30px;text-align:center}.badge{display:inline-block;border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:7px 13px;font-size:13px;margin-bottom:14px;background:rgba(255,255,255,.08)}h1{margin:0 auto 12px;max-width:860px;font-size:clamp(27px,5vw,42px);line-height:1.22}.hero p{margin:0 auto;max-width:760px;color:#d9e6f8;line-height:1.65}.wrap{max-width:920px;margin:0 auto;padding:0 18px 60px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px rgba(6,18,36,.22)}.switch{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:22px;color:var(--muted);font-size:14px}.switch a{color:var(--accent);font-weight:700;text-decoration:none}.field{border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;background:#fff}label{display:block;font-weight:750;line-height:1.5}.num{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:var(--navy);color:white;font-size:13px;margin-right:9px}input,textarea{width:100%;margin-top:12px;border:1px solid #cfd8e5;border-radius:14px;padding:13px 14px;font:inherit;line-height:1.5;outline:none;background:#fbfdff}button{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,#1f6feb,#0b4ab0);color:white;padding:17px 20px;font-size:17px;font-weight:850;cursor:pointer}button:disabled{opacity:.55}.message{display:none;margin-top:14px;padding:14px;border-radius:14px;font-weight:700}.ok{background:#ecfdf3;color:#087443;border:1px solid #abefc6}.err{background:#fff1f3;color:#c01048;border:1px solid #fecdd6}</style></head><body><div class="hero"><div class="badge">JINIUS 숫자경영 사전진단 · 건설업/인테리어</div><h1>건설업/인테리어 회사 특화 질문지 - 실무자용</h1><p>실무 관점에서 견적-계약-현장운영-증빙-보고 흐름과 반복 입력/누락 업무를 파악합니다.<br>응답 내용은 지니어스 내부 진단용 구글시트에만 저장됩니다.</p></div><main class="wrap"><form id="survey" class="card"><div class="switch"><span>현재 질문지: <b>실무자용</b></span><a href="/construction-interior/owner.html">대표자용으로 이동</a></div><div class="field"><label><span class="num">1</span>성함</label><input type="text" name="q0" required placeholder="답변을 입력해주세요"></div><div class="field"><label><span class="num">2</span>회사명</label><input type="text" name="q1" required placeholder="답변을 입력해주세요"></div><div class="field"><label><span class="num">3</span>부서/직무</label><input type="text" name="q2" required placeholder="답변을 입력해주세요"></div><div class="field"><label><span class="num">4</span>주요 담당 업무는 무엇인가요?</label><textarea name="q3" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">5</span>현재 가장 많이 사용하는 엑셀/대장/보고서 이름과 용도는 무엇인가요?</label><textarea name="q4" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">6</span>견적서 작성부터 계약/착공까지 어떤 순서로 업무가 진행되나요?</label><textarea name="q5" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">7</span>자재 발주·외주 요청·공사 일정 변경은 어디에 기록하고 공유하나요?</label><textarea name="q6" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">8</span>현장별 지출/원가를 입력할 때 꼭 필요한 정보는 무엇인가요?</label><textarea name="q7" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">9</span>영수증·세금계산서·거래명세서·계약서·견적서 등 증빙은 현재 어디에 보관하나요?</label><textarea name="q8" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">10</span>같은 내용을 두 번 이상 입력하거나 옮겨 적는 업무는 무엇인가요?</label><textarea name="q9" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">11</span>설계변경/추가공사/감액이 생겼을 때 누가 확인하고 어떻게 반영하나요?</label><textarea name="q10" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">12</span>현장별 미수금·미지급금·입금예정일을 확인할 때 어려운 점은 무엇인가요?</label><textarea name="q11" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">13</span>대표님/임원진에게 정기적으로 보고하는 숫자나 현황은 무엇인가요?</label><textarea name="q12" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">14</span>부서/현장 간 요청사항이나 인수인계가 누락되는 경우는 어떤 업무에서 발생하나요?</label><textarea name="q13" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">15</span>새 시스템 도입 시 실무자 입장에서 가장 부담되는 점은 무엇인가요?</label><textarea name="q14" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">16</span>업무 과부하를 줄이기 위해 가장 먼저 자동화/정리되었으면 하는 업무 3가지는 무엇인가요?</label><textarea name="q15" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">17</span>현장 방문 전 지니어스가 미리 보면 좋은 엑셀/양식/자료가 있다면 적어주세요.</label><textarea name="q16" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><div class="field"><label><span class="num">18</span>추가로 전달하고 싶은 내용이 있으면 자유롭게 작성해주세요.</label><textarea name="q17" rows="4"  placeholder="구체적으로 작성해주시면 진단에 도움이 됩니다."></textarea></div><button id="submitBtn" type="submit">답변 제출하기</button><div id="msg" class="message"></div></form></main><script>const form=document.getElementById('survey'),btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='제출 중입니다...';msg.style.display='none';const fd=new FormData(form),answers={};for(let i=0;i<18;i++)answers['q'+i]=(fd.get('q'+i)||'').toString().trim();try{const res=await fetch('https://decorating-discrimination-height-journalist.trycloudflare.com/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'interior_staff',answers})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||'제출에 실패했습니다.');form.reset();msg.className='message ok';msg.textContent='제출 완료되었습니다. 소중한 답변 감사합니다.';msg.style.display='block';}catch(err){msg.className='message err';msg.textContent='제출 중 오류가 발생했습니다: '+err.message;msg.style.display='block';}finally{btn.disabled=false;btn.textContent='답변 제출하기';}});</script></body></html>
